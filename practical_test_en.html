<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Certified Architect — Practical Test</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f0f2f5;
        --text: #1a1a2e;
        --surface: #ffffff;
        --surface-alt: #f7fafc;
        --muted: #718096;
        --border: #e2e8f0;
        --accent: #2b6cb0;
        --accent-soft: #ebf8ff;
        --card-border: #d0dff0;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        --sidebar-bg: #1a1a2e;
        --sidebar-text: #cdd3de;
        --sidebar-muted: #7f8fa6;
        --sidebar-border: #2c2c4a;
        --sidebar-hover: #242447;
        --scenario-bg: #ebf8ff;
        --scenario-text: #2b6cb0;
        --explanation-bg: #fffbeb;
        --explanation-text: #744210;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      body.dark-theme {
        --bg: #0f172a;
        --text: #e2e8f0;
        --surface: #111827;
        --surface-alt: #1f2937;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #63b3ed;
        --accent-soft: #1e3a5f;
        --card-border: #475569;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        --sidebar-bg: #020617;
        --sidebar-text: #e2e8f0;
        --sidebar-muted: #94a3b8;
        --sidebar-border: #1f2937;
        --sidebar-hover: #1f2937;
        --scenario-bg: #1e3a5f;
        --scenario-text: #90cdf4;
        --explanation-bg: #3f2b1d;
        --explanation-text: #fbbf24;
      }

      .shell {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        min-width: 260px;
        background: var(--sidebar-bg);
        color: var(--sidebar-text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-header {
        padding: 14px 16px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--sidebar-muted);
        border-bottom: 1px solid var(--sidebar-border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .sidebar-progress {
        padding: 10px 16px;
        font-size: 12px;
        color: var(--sidebar-muted);
        border-bottom: 1px solid var(--sidebar-border);
        flex-shrink: 0;
      }
      .sidebar-progress span {
        color: var(--sidebar-text);
        font-weight: 600;
      }
      .sidebar-scroll {
        overflow-y: auto;
        flex: 1;
        padding: 8px 0;
      }
      .sidebar-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: #2c2c4a;
        border-radius: 2px;
      }

      .scenario-group {
        margin-bottom: 4px;
      }
      .scenario-label {
        padding: 6px 16px 4px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4a5568;
      }
      .q-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 16px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 13.5px;
        color: #a0aec0;
        text-align: left;
        transition:
          background 0.15s,
          color 0.15s;
        border-left: 3px solid transparent;
      }
      .q-btn:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-text);
      }
      .q-btn.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-left-color: var(--accent);
      }
      .q-btn.answered-correct {
        color: #68d391;
      }
      .q-btn.answered-correct .q-dot {
        background: #68d391;
      }
      .q-btn.answered-wrong {
        color: #fc8181;
      }
      .q-btn.answered-wrong .q-dot {
        background: #fc8181;
      }
      .q-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
        transition: background 0.2s;
      }

      /* Main */
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        box-shadow: var(--shadow);
      }
      .topbar-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
      }
      .topbar-nav {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .nav-btn {
        padding: 7px 18px;
        border-radius: 8px;
        border: 1.5px solid var(--border);
        background: var(--surface);
        font-size: 14px;
        cursor: pointer;
        color: var(--text);
        font-weight: 500;
        transition: all 0.15s;
      }
      .nav-btn:hover {
        background: var(--surface-alt);
        border-color: var(--muted);
      }
      .nav-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .nav-btn.finish {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .nav-btn.finish:hover {
        background: #2c5282;
      }
      .theme-toggle {
        min-width: 92px;
      }
      .set-switch {
        display: inline-flex;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .set-btn {
        padding: 7px 16px;
        border: none;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      .set-btn + .set-btn {
        border-left: 1.5px solid var(--border);
      }
      .set-btn:hover {
        background: var(--surface-alt);
      }
      .set-btn.active {
        background: var(--accent);
        color: #fff;
      }
      .sidebar-header .set-switch {
        border-color: var(--sidebar-border);
      }
      .sidebar-header .set-btn {
        padding: 4px 10px;
        font-size: 12px;
        background: transparent;
        color: var(--sidebar-muted);
      }
      .sidebar-header .set-btn + .set-btn {
        border-left-color: var(--sidebar-border);
      }
      .sidebar-header .set-btn:hover {
        background: var(--sidebar-hover);
        color: var(--sidebar-text);
      }
      .sidebar-header .set-btn.active {
        background: var(--accent);
        color: #fff;
      }
      .q-counter {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 36px 48px;
      }
      .content::-webkit-scrollbar {
        width: 6px;
      }
      .content::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 3px;
      }

      /* Question card */
      .q-card {
        max-width: 820px;
        margin: 0 auto;
      }
      .q-scenario {
        display: inline-block;
        background: var(--scenario-bg);
        color: var(--scenario-text);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 16px;
      }
      .q-number {
        font-size: 13px;
        color: #a0aec0;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .q-situation {
        font-size: 16.5px;
        color: var(--text);
        font-weight: 500;
        line-height: 1.7;
        background: var(--surface);
        border: 1.5px solid var(--card-border);
        border-radius: 10px;
        padding: 16px 20px;
        box-shadow: var(--shadow);
        margin-bottom: 22px;
      }
      .q-situation code,
      .opt-text code,
      .explanation code {
        background: var(--surface-alt);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: "SF Mono", Menlo, Monaco, monospace;
        font-size: 13.5px;
        color: var(--text);
      }
      .explanation code {
        background: var(--surface-alt);
      }
      .q-prompt {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 20px;
      }

      /* Options */
      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 24px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px 18px;
        border: 2px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        background: var(--surface);
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.1s;
      }
      .option:hover:not(.locked) {
        border-color: var(--accent);
        background: var(--accent-soft);
        transform: translateX(2px);
      }
      .option.locked {
        cursor: default;
      }
      .opt-letter {
        width: 30px;
        height: 30px;
        min-width: 30px;
        border-radius: 50%;
        background: #edf2f7;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        color: #4a5568;
        transition:
          background 0.2s,
          color 0.2s;
        flex-shrink: 0;
      }
      .opt-text {
        font-size: 15px;
        color: var(--text);
        line-height: 1.55;
        padding-top: 3px;
      }

      .option.correct {
        border-color: #48bb78;
        background: #f0fff4;
      }
      .option.correct .opt-letter {
        background: #48bb78;
        color: #fff;
      }
      .option.wrong {
        border-color: #fc8181;
        background: #fff5f5;
      }
      .option.wrong .opt-letter {
        background: #fc8181;
        color: #fff;
      }
      .option.dimmed {
        opacity: 0.55;
      }
      .option.selected {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .option.selected .opt-letter {
        background: var(--accent);
        color: #fff;
      }
      .confirm-btn {
        align-self: flex-start;
        margin-bottom: 24px;
        padding: 12px 28px;
        background: #2b6cb0;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
      }
      .confirm-btn:hover:not(:disabled) {
        background: #2c5282;
      }
      .confirm-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* Dark-theme overrides to ensure readable option text/background */
      body.dark-theme .option {
        background: #071226; /* dark card */
        border-color: #1f2a3a;
      }
      body.dark-theme .option .opt-text {
        color: #e6eef8; /* readable white-ish text */
      }
      body.dark-theme .option.locked {
        background: #071226;
      }
      body.dark-theme .option.correct {
        background: rgba(72, 187, 120, 0.08);
        border-color: #2f855a;
      }
      body.dark-theme .option.correct .opt-text {
        color: #e6fff5;
      }
      body.dark-theme .option.wrong {
        background: rgba(252, 129, 129, 0.06);
        border-color: #b83232;
      }
      body.dark-theme .option.wrong .opt-text {
        color: #ffecec;
      }
      body.dark-theme .opt-letter {
        background: #0f1724;
        color: #e2e8f0;
      }
      body.dark-theme .option.correct .opt-letter {
        background: #2f855a;
        color: #fff;
      }
      body.dark-theme .option.wrong .opt-letter {
        background: #c53030;
        color: #fff;
      }
      body.dark-theme .option.dimmed {
        opacity: 0.55;
      }
      body.dark-theme .option.selected {
        background: var(--accent-soft);
        border-color: var(--accent);
      }

      /* Explanation */
      .explanation {
        margin-top: 4px;
        padding: 14px 18px;
        background: var(--explanation-bg);
        border-left: 4px solid #f6ad55;
        border-radius: 0 10px 10px 0;
        font-size: 14.5px;
        color: var(--explanation-text);
        line-height: 1.65;
        display: none;
      }
      .explanation.show {
        display: block;
      }
      .explanation strong {
        color: var(--explanation-text);
      }

      /* Summary */
      .summary {
        max-width: 820px;
        margin: 0 auto;
        display: none;
      }
      .summary.show {
        display: block;
      }
      .summary h1 {
        font-size: 26px;
        font-weight: 800;
        color: var(--text);
        margin-bottom: 6px;
      }
      .summary-subtitle {
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 28px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 32px;
      }
      .score-card {
        background: var(--surface);
        border-radius: 14px;
        padding: 20px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .score-card .big {
        font-size: 38px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 6px;
      }
      .score-card .label {
        font-size: 13px;
        color: #718096;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .score-card.total .big {
        color: #2b6cb0;
      }
      .score-card.correct-c .big {
        color: #38a169;
      }
      .score-card.wrong-c .big {
        color: #e53e3e;
      }

      .section-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--border);
      }
      .group-block {
        background: var(--surface);
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
      }
      .group-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .group-badge {
        font-size: 11px;
        padding: 2px 10px;
        border-radius: 20px;
        font-weight: 700;
        background: #fff5f5;
        color: #c53030;
      }
      .wrong-item {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
        color: var(--text);
      }
      .wrong-item:last-child {
        border-bottom: none;
      }
      .wrong-item .wi-n {
        min-width: 32px;
        font-weight: 700;
        color: #a0aec0;
        font-size: 12px;
        padding-top: 2px;
      }
      .wrong-item .wi-q {
        flex: 1;
      }
      .wrong-item .wi-situation {
        font-size: 13.5px;
        color: var(--text);
        font-weight: 500;
        margin-bottom: 4px;
        line-height: 1.5;
      }
      .wrong-item .wi-situation code {
        background: var(--surface-alt);
        padding: 1px 4px;
        border-radius: 3px;
        font-family: "SF Mono", Menlo, Monaco, monospace;
        font-size: 12.5px;
      }
      .wrong-item .wi-prompt {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
        margin-bottom: 4px;
      }
      .wrong-item .wi-ans {
        font-size: 12px;
        margin-top: 3px;
        color: var(--muted);
      }
      .wi-wrong-tag {
        color: #e53e3e;
        font-weight: 700;
      }
      .wi-correct-tag {
        color: #38a169;
        font-weight: 700;
      }

      .restart-btn {
        margin-top: 28px;
        padding: 12px 32px;
        background: #2b6cb0;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s;
      }
      .restart-btn:hover {
        background: #2c5282;
      }

      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar">
        <div class="sidebar-header">
          <span id="sidebarTitle">Question Set 1</span>
          <div class="set-switch" role="group" aria-label="Question set">
            <button class="set-btn active" data-set="1" onclick="setSet(1)">
              Set 1
            </button>
            <button class="set-btn" data-set="2" onclick="setSet(2)">
              Set 2
            </button>
          </div>
        </div>
        <div class="sidebar-progress">
          Answered: <span id="answeredCount">0</span> /
          <span id="totalCount">0</span>
        </div>
        <div class="sidebar-scroll" id="sidebarList"></div>
      </nav>
      <div class="main">
        <div class="topbar">
          <div class="topbar-title">
            Claude Certified Architect — Practical Test
          </div>
          <div class="topbar-nav">
            <span class="q-counter" id="qCounter"></span>
            <button
              class="nav-btn theme-toggle"
              id="themeToggle"
              onclick="toggleTheme()"
              aria-pressed="false"
            >
              🌙 Dark
            </button>
            <button
              class="nav-btn"
              id="prevBtn"
              onclick="navigate(-1)"
              disabled
            >
              &#8592; Prev
            </button>
            <button class="nav-btn" id="nextBtn" onclick="navigate(1)">
              Next &#8594;
            </button>
            <button
              class="nav-btn finish"
              id="finishBtn"
              onclick="showSummary()"
            >
              Finish &amp; Review
            </button>
          </div>
        </div>
        <div class="content">
          <div class="screen active" id="questionScreen">
            <div class="q-card" id="qCard"></div>
          </div>
          <div class="screen" id="summaryScreen">
            <div class="summary show" id="summaryContent"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const themeToggleBtn = document.getElementById("themeToggle");

      function applyTheme(theme) {
        document.body.classList.toggle("dark-theme", theme === "dark");
        if (themeToggleBtn) {
          themeToggleBtn.textContent =
            theme === "dark" ? "☀️ Light" : "🌙 Dark";
          themeToggleBtn.setAttribute("aria-pressed", String(theme === "dark"));
        }
        if (typeof localStorage !== "undefined") {
          localStorage.setItem("practicalTestTheme", theme);
        }
      }

      function toggleTheme() {
        const nextTheme = document.body.classList.contains("dark-theme")
          ? "light"
          : "dark";
        applyTheme(nextTheme);
      }

      const savedTheme =
        typeof localStorage !== "undefined"
          ? localStorage.getItem("practicalTestTheme")
          : null;
      const initialTheme =
        savedTheme ||
        (window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");
      applyTheme(initialTheme);

      const QUESTIONS1 = [
        {
          n: 1,
          scenario: "Multi-agent Research System",
          situation:
            "A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively?",
          question: "Which approach is most effective?",
          options: [
            {
              letter: "A",
              text: "Apply credibility heuristics to pick the most likely correct number, finish analysis with that value, and add a footnote mentioning the discrepancy.",
              correct: false,
            },
            {
              letter: "B",
              text: "Include both numbers in the analysis output without marking them as conflicting, letting the synthesis agent decide which to use based on broader context.",
              correct: false,
            },
            {
              letter: "C",
              text: "Stop analysis and immediately escalate to the coordinator, asking it to decide which source is more authoritative before continuing.",
              correct: false,
            },
            {
              letter: "D",
              text: "Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis.",
              correct: true,
            },
          ],
          correct: "D",
          explanation:
            "This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context.",
          global_n: 1,
        },
        {
          n: 2,
          scenario: "Multi-agent Research System",
          situation:
            "The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report?",
          question: "Which next step is most appropriate?",
          options: [
            {
              letter: "A",
              text: "Each agent sends its results directly to the report-writing agent, bypassing the coordinator.",
              correct: false,
            },
            {
              letter: "B",
              text: "The document analysis agent requests web-search results and merges them internally.",
              correct: false,
            },
            {
              letter: "C",
              text: "The coordinator passes both sets of results to the synthesis agent for a unified integration.",
              correct: true,
            },
            {
              letter: "D",
              text: "The coordinator concatenates the raw outputs from both agents and returns them as the final result.",
              correct: false,
            },
          ],
          correct: "C",
          explanation:
            "In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging.",
          global_n: 2,
        },
        {
          n: 3,
          scenario: "Multi-agent Research System",
          situation:
            "A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?",
          question: "Which improvement is most effective?",
          options: [

      const QUESTION_SETS = { 1: QUESTIONS1, 2: QUESTIONS2 };

      const state = {
        set: 1,
        current: 0,
        answers: { 1: {}, 2: {} },
        pending: { 1: {}, 2: {} },
      };

      function questions() {
        return QUESTION_SETS[state.set];
      }

      function answers() {
        return state.answers[state.set];
      }

      function pending() {
        return state.pending[state.set];
      }

      function isMulti(q) {
        return Array.isArray(q.correct);
      }

      function isCorrectAnswer(q, ans) {
        if (!isMulti(q)) return ans === q.correct;
        return (
          Array.isArray(ans) &&
          ans.length === q.correct.length &&
          q.correct.every((l) => ans.includes(l))
        );
      }

      function letterList(ans) {
        return Array.isArray(ans) ? ans.join(", ") : ans;
      }

      function optionTexts(q, ans) {
        return [].concat(ans)
          .map((l) => {
            const o = q.options.find((x) => x.letter === l);
            return o ? md(o.text) : "";
          })
          .join("; ");
      }

      function setSet(n) {
        if (n === state.set) return;
        state.set = n;
        state.current = 0;
        document.querySelectorAll(".set-btn").forEach((b) => {
          b.classList.toggle("active", Number(b.dataset.set) === n);
        });
        document.getElementById("sidebarTitle").textContent =
          "Question Set " + n;
        document.getElementById("summaryScreen").classList.remove("active");
        document.getElementById("questionScreen").classList.add("active");
        buildSidebar();
        renderQuestion(0);
        updateSidebar();
      }

      function md(text) {
        if (!text) return "";
        return text
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\n/g, " ");
      }

      function buildSidebar() {
        const list = document.getElementById("sidebarList");
        list.innerHTML = "";
        document.getElementById("totalCount").textContent = questions().length;
        let currentScenario = null;
        let groupEl = null;
        questions().forEach((q, idx) => {
          if (q.scenario !== currentScenario) {
            currentScenario = q.scenario;
            const sg = document.createElement("div");
            sg.className = "scenario-group";
            const lbl = document.createElement("div");
            lbl.className = "scenario-label";
            lbl.textContent = q.scenario;
            sg.appendChild(lbl);
            groupEl = sg;
            list.appendChild(sg);
          }
          const btn = document.createElement("button");
          btn.className = "q-btn";
          btn.id = "sb-" + idx;
          btn.onclick = () => goto(idx);
          btn.innerHTML = '<span class="q-dot"></span> Q' + q.global_n;
          groupEl.appendChild(btn);
        });
      }

      function updateSidebar() {
        questions().forEach((q, idx) => {
          const btn = document.getElementById("sb-" + idx);
          if (!btn) return;
          btn.className = "q-btn";
          if (idx === state.current) btn.classList.add("active");
          const ans = answers()[q.global_n];
          if (ans !== undefined) {
            btn.classList.add(
              isCorrectAnswer(q, ans) ? "answered-correct" : "answered-wrong",
            );
          }
        });
        document.getElementById("answeredCount").textContent = Object.keys(
          answers(),
        ).length;
      }

      function renderQuestion(idx) {
        const q = questions()[idx];
        const chosen = answers()[q.global_n];
        const locked = chosen !== undefined;
        const multi = isMulti(q);
        const picks = locked
          ? [].concat(chosen)
          : pending()[q.global_n] || [];

        document.getElementById("qCounter").textContent =
          idx + 1 + " / " + questions().length;
        document.getElementById("prevBtn").disabled = idx === 0;
        document.getElementById("nextBtn").disabled =
          idx === questions().length - 1;

        const optionsHtml = q.options
          .map((opt) => {
            let cls = "option";
            if (locked) {
              cls += " locked";
              if (opt.correct) cls += " correct";
              else if (picks.includes(opt.letter)) cls += " wrong";
              else cls += " dimmed";
            } else if (picks.includes(opt.letter)) {
              cls += " selected";
            }
            return (
              '<div class="' +
              cls +
              '" data-letter="' +
              opt.letter +
              '" onclick="answer(' +
              q.global_n +
              ", '" +
              opt.letter +
              "')\">" +
              '<div class="opt-letter">' +
              opt.letter +
              "</div>" +
              '<div class="opt-text">' +
              md(opt.text) +
              "</div></div>"
            );
          })
          .join("");

        const need = multi ? q.correct.length : 1;
        const confirmHtml = !locked
          ? '<button class="confirm-btn" onclick="confirmAnswer(' +
              q.global_n +
              ')"' +
              (picks.length === need ? "" : " disabled") +
              ">Check answer" +
              (multi ? " (" + picks.length + " / " + need + " selected)" : "") +
              "</button>"
          : idx === questions().length - 1
            ? '<button class="confirm-btn" onclick="showSummary()">Finish</button>'
            : '<button class="confirm-btn" onclick="navigate(1)">Next</button>';

        const expl = locked
          ? '<div class="explanation show"><strong>Why ' +
            letterList(q.correct) +
            ":</strong> " +
            md(q.explanation) +
            "</div>"
          : '<div class="explanation"></div>';

        document.getElementById("qCard").innerHTML =
          '<div class="q-number">Question ' +
          q.global_n +
          "</div>" +
          '<div class="q-scenario">' +
          q.scenario +
          "</div>" +
          '<div class="q-situation">' +
          md(q.situation) +
          "</div>" +
          '<div class="q-prompt">' +
          md(q.question) +
          "</div>" +
          '<div class="options">' +
          optionsHtml +
          "</div>" +
          confirmHtml +
          expl;
      }

      function answer(globalN, letter) {
        if (answers()[globalN] !== undefined) return;
        const q = questions().find((x) => x.global_n === globalN);
        const cur = pending()[globalN] || [];
        if (!isMulti(q)) {
          pending()[globalN] = cur.includes(letter) ? [] : [letter];
        } else if (cur.includes(letter)) {
          pending()[globalN] = cur.filter((l) => l !== letter);
        } else if (cur.length < q.correct.length) {
          pending()[globalN] = cur.concat(letter);
        }
        renderQuestion(state.current);
      }

      function confirmAnswer(globalN) {
        const q = questions().find((x) => x.global_n === globalN);
        const picks = pending()[globalN] || [];
        const need = isMulti(q) ? q.correct.length : 1;
        if (answers()[globalN] !== undefined || picks.length !== need) return;
        answers()[globalN] = isMulti(q) ? picks.slice().sort() : picks[0];
        renderQuestion(state.current);
        updateSidebar();
      }

      function navigate(dir) {
        goto(state.current + dir);
      }

      function goto(idx) {
        if (idx < 0 || idx >= questions().length) return;
        document.getElementById("questionScreen").classList.add("active");
        document.getElementById("summaryScreen").classList.remove("active");
        state.current = idx;
        renderQuestion(idx);
        updateSidebar();
      }

      function showSummary() {
        document.getElementById("questionScreen").classList.remove("active");
        document.getElementById("summaryScreen").classList.add("active");

        const total = questions().length;
        const answered = Object.keys(answers()).length;
        let correct = 0;
        const wrongByScenario = {};

        questions().forEach((q) => {
          const ans = answers()[q.global_n];
          if (ans === undefined) return;
          if (isCorrectAnswer(q, ans)) {
            correct++;
          } else {
            if (!wrongByScenario[q.scenario]) wrongByScenario[q.scenario] = [];
            wrongByScenario[q.scenario].push({ q: q, chosen: ans });
          }
        });

        const wrong = answered - correct;
        const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
        const unanswered = total - answered;

        let wrongGroupsHtml = "";
        for (const scenario in wrongByScenario) {
          const items = wrongByScenario[scenario];
          const rows = items
            .map((item) => {
              return (
                '<div class="wrong-item">' +
                '<div class="wi-n">Q' +
                item.q.global_n +
                "</div>" +
                '<div class="wi-q">' +
                '<div class="wi-situation">' +
                md(item.q.situation) +
                "</div>" +
                '<div class="wi-prompt">' +
                md(item.q.question) +
                "</div>" +
                '<div class="wi-ans">' +
                'Your answer: <span class="wi-wrong-tag">' +
                letterList(item.chosen) +
                "</span> — " +
                optionTexts(item.q, item.chosen) +
                "<br>" +
                'Correct: <span class="wi-correct-tag">' +
                letterList(item.q.correct) +
                "</span> — " +
                optionTexts(item.q, item.q.correct) +
                "</div>" +
                "</div></div>"
              );
            })
            .join("");
          wrongGroupsHtml +=
            '<div class="group-block">' +
            '<div class="group-title">' +
            scenario +
            '<span class="group-badge">' +
            items.length +
            " incorrect</span></div>" +
            rows +
            "</div>";
        }

        const unansweredNote =
          unanswered > 0
            ? '<p style="color:#e53e3e;font-size:14px;margin-bottom:20px;font-weight:600;">&#9888; ' +
              unanswered +
              " question(s) not answered.</p>"
            : "";

        document.getElementById("summaryContent").innerHTML =
          "<h1>Exam Complete</h1>" +
          '<p class="summary-subtitle">You answered ' +
          answered +
          " of " +
          total +
          " questions.</p>" +
          unansweredNote +
          '<div class="score-grid">' +
          '<div class="score-card total"><div class="big">' +
          pct +
          '%</div><div class="label">Score</div></div>' +
          '<div class="score-card correct-c"><div class="big">' +
          correct +
          '</div><div class="label">Correct</div></div>' +
          '<div class="score-card wrong-c"><div class="big">' +
          wrong +
          '</div><div class="label">Incorrect</div></div>' +
          "</div>" +
          (wrong > 0
            ? '<div class="section-title">Incorrect answers by scenario</div>' +
              wrongGroupsHtml
            : '<p style="color:#38a169;font-weight:700;font-size:17px;">All answered questions correct!</p>') +
          '<button class="restart-btn" onclick="restart()">Restart Exam</button>';
      }

      function restart() {
        state.answers[state.set] = {};
        state.pending[state.set] = {};
        state.current = 0;
        document.getElementById("questionScreen").classList.add("active");
        document.getElementById("summaryScreen").classList.remove("active");
        renderQuestion(0);
        updateSidebar();
      }

      buildSidebar();
      renderQuestion(0);
      updateSidebar();
    </script>
